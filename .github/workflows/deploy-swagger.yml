name: Deploy Swagger UI

on:
  push:
    branches: [ "merge/FE-BE" ] # Adjusted to the current branch.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Backend/VSTEP_Writing_System.slnx

      - name: Build and Generate Swagger
        run: |
          # The build now automatically generates Swagger JSON thanks to Microsoft.Extensions.ApiDescription.Server
          dotnet build Backend/VSTEP_Writing_System.slnx --configuration Release --no-restore
          # Rename the auto-generated file (usually v1.json) to swagger.json for the UI
          mv Backend/docs/v1.json Backend/docs/swagger.json || true
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Jwt__SecretKey: ${{ secrets.JWT_SECRET_KEY }}
          ConnectionStrings__PoolerConnection: ${{ secrets.SUPABASE_CONNECTION_STRING }}
          Supabase__Url: ${{ secrets.SUPABASE_URL }}
          Supabase__AnonKey: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Backend/docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
